<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>HMD Décor | الإدارة</title>

<style>
:root{
  --g:#c9a45c;
  --bg:#0b0b0b;
  --c:#151515;
  --b:#2c2c2c;
  --danger:#762b2b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:#eee;
  font-family:Arial,Tahoma,sans-serif;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:22px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  border-bottom:1px solid var(--b);
  padding-bottom:15px;
}

.head h1{
  color:var(--g);
  margin:0;
}

a{
  color:var(--g);
  text-decoration:none;
}

.panel{
  background:var(--c);
  border:1px solid var(--b);
  border-radius:10px;
  padding:20px;
  margin:18px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  color:var(--g);
  margin:8px 0;
}

input,
textarea,
button{
  width:100%;
  padding:12px;
  border-radius:6px;
  border:1px solid #383838;
  background:#0e0e0e;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:var(--g);
  color:#111;
  border:0;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.danger{
  background:var(--danger);
  color:#fff;
}

.media{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.item{
  border:1px solid var(--b);
  padding:10px;
  border-radius:8px;
  background:#101010;
}

.item img,
.item video{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:6px;
  display:block;
}

.filename{
  color:#aaa;
  font-size:12px;
  margin-top:8px;
  word-break:break-word;
}

.muted{
  color:#aaa;
  font-size:13px;
  line-height:1.7;
}

.status{
  margin-top:12px;
  color:#9bd58a;
  line-height:1.7;
}

.error{
  color:#ff8585;
}

.loading{
  color:var(--g);
  padding:15px 0;
}

@media(max-width:700px){
  .grid,
  .media{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="head">
  <h1>HMD Décor</h1>
  <a href="index.html">← الموقع</a>
</div>

<div class="panel">

<h2>إعدادات الاتصال</h2>

<div class="grid">

<div>
<label>الهاتف</label>
<input id="phone" placeholder="+213 ...">
</div>

<div>
<label>واتساب</label>
<input id="wa" placeholder="213...">
</div>

<div>
<label>البريد</label>
<input id="email" placeholder="contact@...">
</div>

<div>
<label>العنوان</label>
<input id="address" placeholder="مشرية وما جاورها">
</div>

</div>

<label>النص الرئيسي</label>
<textarea id="hero"></textarea>

<button onclick="saveSettings()">حفظ الإعدادات</button>

<div id="settingsStatus" class="status"></div>

</div>


<div class="panel">

<h2>الصور والفيديوهات</h2>

<p class="muted">
الصور والفيديوهات يتم تخزينها في Supabase Storage.
</p>

<input
  type="file"
  id="files"
  multiple
  accept="image/*,video/*"
>

<button onclick="uploadFiles()">رفع الملفات</button>

<div id="uploadStatus" class="status"></div>

<div id="list" class="media"></div>

</div>


<div class="panel">

<h2>حالة الربط</h2>

<p id="connectionStatus" class="status">
جاري تشغيل لوحة الإدارة...
</p>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

"use strict";

/* =========================
   التحقق من المكتبات
========================= */

const statusBox =
  document.getElementById("connectionStatus");


function setStatus(message, error=false){

  statusBox.className =
    error ? "status error" : "status";

  statusBox.textContent = message;

}


/* =========================
   التحقق من config.js
========================= */

if(!window.HMD_CONFIG){

  setStatus(
    "❌ لم يتم تحميل config.js. تأكد أن config.js موجود بجانب admin.html.",
    true
  );

}else if(!window.HMD_CONFIG.SUPABASE_URL){

  setStatus(
    "❌ SUPABASE_URL غير موجود في config.js.",
    true
  );

}else if(!window.HMD_CONFIG.SUPABASE_ANON_KEY){

  setStatus(
    "❌ SUPABASE_ANON_KEY غير موجود في config.js.",
    true
  );

}else if(!window.HMD_CONFIG.STORAGE_BUCKET){

  setStatus(
    "❌ STORAGE_BUCKET غير موجود في config.js.",
    true
  );

}else if(!window.supabase){

  setStatus(
    "❌ مكتبة Supabase لم يتم تحميلها.",
    true
  );

}else{

  startAdmin();

}


/* =========================
   تشغيل الإدارة
========================= */

function startAdmin(){

  const CONFIG = window.HMD_CONFIG;

  const BUCKET =
    CONFIG.STORAGE_BUCKET;

  const client =
    window.supabase.createClient(
      CONFIG.SUPABASE_URL,
      CONFIG.SUPABASE_ANON_KEY
    );


  window.HMD_SUPABASE = client;
  window.HMD_BUCKET = BUCKET;


  setStatus(
    "جاري الاتصال بـ Supabase..."
  );


  checkConnection(
    client,
    BUCKET
  );

}


/* =========================
   فحص الاتصال
========================= */

async function checkConnection(
  client,
  bucket
){

  try{

    const timeout =
      new Promise((_, reject) =>
        setTimeout(
          () =>
            reject(
              new Error(
                "انتهت مهلة الاتصال. تأكد من الرابط أو الاتصال بالإنترنت."
              )
            ),
          10000
        )
      );


    const request =
      client.storage
        .from(bucket)
        .list("", {
          limit:1
        });


    const result =
      await Promise.race([
        request,
        timeout
      ]);


    if(result.error){

      setStatus(
        "❌ Supabase رفض الطلب: " +
        result.error.message,
        true
      );

      return;

    }


    setStatus(
      "✅ Supabase متصل بنجاح"
    );


    await loadFiles();

  }catch(error){

    console.error(error);

    setStatus(
      "❌ فشل الاتصال: " +
      error.message,
      true
    );

  }

}


/* =========================
   الإعدادات
========================= */

const SETTINGS_KEY =
  "hmd_site_settings_v2";


const defaultSettings = {

  phone:"+213 XX XX XX XX",

  wa:"213000000000",

  email:"contact@hmddecor.dz",

  address:"مشرية وما جاورها",

  hero:
  "نصمم مساحات تجمع بين الفخامة والراحة واللمسة الشخصية."

};


function loadSettings(){

  let data =
    {...defaultSettings};


  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          SETTINGS_KEY
        )
      );

    if(saved){

      data = {
        ...data,
        ...saved
      };

    }

  }catch(e){}


  document.getElementById("phone").value =
    data.phone;

  document.getElementById("wa").value =
    data.wa;

  document.getElementById("email").value =
    data.email;

  document.getElementById("address").value =
    data.address;

  document.getElementById("hero").value =
    data.hero;

}


function saveSettings(){

  const data = {

    phone:
      document.getElementById("phone")
      .value.trim(),

    wa:
      document.getElementById("wa")
      .value.trim(),

    email:
      document.getElementById("email")
      .value.trim(),

    address:
      document.getElementById("address")
      .value.trim(),

    hero:
      document.getElementById("hero")
      .value.trim()

  };


  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(data)
  );


  document.getElementById(
    "settingsStatus"
  ).textContent =
    "تم حفظ الإعدادات ✓";

}


/* =========================
   رفع الملفات
========================= */

async function uploadFiles(){

  const client =
    window.HMD_SUPABASE;

  const bucket =
    window.HMD_BUCKET;

  const input =
    document.getElementById("files");

  const status =
    document.getElementById("uploadStatus");

  const files =
    [...input.files];


  if(!files.length){

    status.className =
      "status error";

    status.textContent =
      "اختر صورة أو فيديو أولًا.";

    return;

  }


  status.className =
    "status";

  status.textContent =
    "جاري رفع الملفات...";


  let success = 0;
  let failed = 0;


  for(const file of files){

    try{

      const cleanName =
        file.name
          .replace(/[^\w.\-() ]/g,"_")
          .replace(/\s+/g,"_");


      const path =
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2,8) +
        "_" +
        cleanName;


      const result =
        await client.storage
          .from(bucket)
          .upload(
            path,
            file,
            {
              cacheControl:"3600",
              upsert:false,
              contentType:file.type
            }
          );


      if(result.error){

        console.error(
          result.error
        );

        failed++;

      }else{

        success++;

      }

    }catch(error){

      console.error(error);

      failed++;

    }

  }


  input.value = "";


  if(failed){

    status.className =
      "status error";

  }else{

    status.className =
      "status";

  }


  status.textContent =
    "تم رفع " +
    success +
    " ملف ✓" +
    (
      failed
      ? " — فشل " + failed + " ملف"
      : ""
    );


  await loadFiles();

}


/* =========================
   عرض الملفات
========================= */

async function loadFiles(){

  const client =
    window.HMD_SUPABASE;

  const bucket =
    window.HMD_BUCKET;

  const list =
    document.getElementById("list");


  list.innerHTML =
    '<div class="loading">جاري تحميل الملفات...</div>';


  try{

    const result =
      await client.storage
        .from(bucket)
        .list("", {
          limit:100,
          sortBy:{
            column:"created_at",
            order:"desc"
          }
        });


    if(result.error){

      list.innerHTML =
        '<div class="status error">' +
        escapeHtml(
          result.error.message
        ) +
        '</div>';

      return;

    }


    const files =
      result.data || [];


    if(!files.length){

      list.innerHTML =
        '<p class="muted">لا توجد ملفات حتى الآن.</p>';

      return;

    }


    list.innerHTML = "";


    files.forEach(file => {

      if(!file.name) return;


      const publicUrl =
        client.storage
          .from(bucket)
          .getPublicUrl(
            file.name
          )
          .data
          .publicUrl;


      const item =
        document.createElement("div");

      item.className =
        "item";


      if(isVideo(file.name)){

        item.innerHTML = `
          <video
            controls
            preload="metadata"
            src="${escapeAttr(publicUrl)}">
          </video>

          <div class="filename">
            ${escapeHtml(file.name)}
          </div>

          <button
            class="danger"
            onclick="deleteFile('${escapeJs(file.name)}')">
            حذف
          </button>
        `;

      }else{

        item.innerHTML = `
          <img
            loading="lazy"
            src="${escapeAttr(publicUrl)}"
            alt="HMD Décor">

          <div class="filename">
            ${escapeHtml(file.name)}
          </div>

          <button
            class="danger"
            onclick="deleteFile('${escapeJs(file.name)}')">
            حذف
          </button>
        `;

      }


      list.appendChild(item);

    });


  }catch(error){

    list.innerHTML =
      '<div class="status error">' +
      escapeHtml(
        error.message
      ) +
      '</div>';

  }

}


/* =========================
   الحذف
========================= */

async function deleteFile(name){

  const client =
    window.HMD_SUPABASE;

  const bucket =
    window.HMD_BUCKET;


  if(
    !confirm(
      "هل أنت متأكد من حذف هذا الملف؟"
    )
  ){

    return;

  }


  const result =
    await client.storage
      .from(bucket)
      .remove([
        name
      ]);


  if(result.error){

    alert(
      "لم يتم الحذف.\n\n" +
      result.error.message +
      "\n\n" +
      "لاحقًا سنضيف حماية دخول الإدارة وصلاحية DELETE."
    );

    return;

  }


  await loadFiles();

}


/* =========================
   أدوات
========================= */

function isVideo(name){

  const ext =
    name
      .split(".")
      .pop()
      .toLowerCase();


  return [
    "mp4",
    "webm",
    "ogg",
    "mov",
    "m4v"
  ].includes(ext);

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


function escapeJs(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}


loadSettings();

</script>

</body>
</html>
